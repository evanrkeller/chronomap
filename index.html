<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChronoMap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="scoreboard" aria-label="City local times"></header>
  <main id="map-area">
    <div id="map-stack">
      <canvas id="map" width="2048" height="1024"
              aria-label="World map showing current day and night regions"></canvas>
      <canvas id="markers" width="2048" height="1024" aria-hidden="true"></canvas>
    </div>
  </main>

  <div id="attribution">

3.169 2.976 1.585 4.314 3.95 1.361 2.364 1.361 5.29 0 3.437-1.8 6.338-1.799 2.9-5.029 4.412-3.23 1.487-8.144 1.487-8.628 0-11.95-3.51-3.323-3.51-3.761-8.923z" fill="#ffffff"/></g></svg>
    <span class="copyright" id="copyright"></span>
  </div>

  <button id="settings-button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/>
    </svg>
  </button>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" novalidate>
      <h2 id="settings-title">Settings</h2>
      <section class="settings-section">
        <h3>Home location</h3>
        <div class="settings-fields">
          <label>Label
            <input name="home-label" type="text" placeholder="Home" autocomplete="off">
          </label>
          <label>Latitude
            <input name="home-lat" type="text" placeholder="33.5465" autocomplete="off">
          </label>
          <label>Longitude
            <input name="home-lon" type="text" placeholder="-86.5497" autocomplete="off">
          </label>
          <label>Time zone
            <input name="home-tz" type="text" list="tz-options" placeholder="America/Chicago" autocomplete="off">
          </label>
        </div>
      </section>
      <section class="settings-section settings-locations">
        <h3>Additional locations</h3>
        <p class="settings-hint">Up to 4 additional locations, shown alongside home and UTC.</p>
        <div class="settings-fields location-row">
          <label>Label <input name="loc-0-label" type="text" autocomplete="off"></label>
          <label>Latitude <input name="loc-0-lat" type="text" autocomplete="off"></label>
          <label>Longitude <input name="loc-0-lon" type="text" autocomplete="off"></label>
          <label>Time zone <input name="loc-0-tz" type="text" list="tz-options" autocomplete="off"></label>
          <button type="button" class="location-clear" data-row="0" aria-label="Clear location 1">✕</button>
        </div>
        <div class="settings-fields location-row">
          <label>Label <input name="loc-1-label" type="text" autocomplete="off"></label>
          <label>Latitude <input name="loc-1-lat" type="text" autocomplete="off"></label>
          <label>Longitude <input name="loc-1-lon" type="text" autocomplete="off"></label>
          <label>Time zone <input name="loc-1-tz" type="text" list="tz-options" autocomplete="off"></label>
          <button type="button" class="location-clear" data-row="1" aria-label="Clear location 2">✕</button>
        </div>
        <div class="settings-fields location-row">
          <label>Label <input name="loc-2-label" type="text" autocomplete="off"></label>
          <label>Latitude <input name="loc-2-lat" type="text" autocomplete="off"></label>
          <label>Longitude <input name="loc-2-lon" type="text" autocomplete="off"></label>
          <label>Time zone <input name="loc-2-tz" type="text" list="tz-options" autocomplete="off"></label>
          <button type="button" class="location-clear" data-row="2" aria-label="Clear location 3">✕</button>
        </div>
        <div class="settings-fields location-row">
          <label>Label <input name="loc-3-label" type="text" autocomplete="off"></label>
          <label>Latitude <input name="loc-3-lat" type="text" autocomplete="off"></label>
          <label>Longitude <input name="loc-3-lon" type="text" autocomplete="off"></label>
          <label>Time zone <input name="loc-3-tz" type="text" list="tz-options" autocomplete="off"></label>
          <button type="button" class="location-clear" data-row="3" aria-label="Clear location 4">✕</button>
        </div>
      </section>
      <fieldset class="settings-section settings-mode">
        <legend>Map centering</legend>
        <label class="mode-option">
          <input type="radio" name="map-mode" value="home" checked>
          Home-centered
        </label>
        <label class="mode-option">
          <input type="radio" name="map-mode" value="sun">
          Sun-centered
        </label>
      </fieldset>
      <p id="settings-error" role="alert" hidden></p>
      <div class="settings-actions">
        <button type="button" id="settings-cancel">Cancel</button>
        <button type="submit" id="settings-save">Save</button>
      </div>
    </form>
    <datalist id="tz-options"></datalist>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
